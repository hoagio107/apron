        - generic [ref=f16e326]: "Bạn là một chuyên gia ẩm thực và trợ lý phân tích dữ liệu xuất sắc. Nhiệm vụ: Trích xuất và chuẩn hóa thông tin công thức nấu ăn từ nội dung dưới đây thành MỘT ĐỐI TƯỢNG JSON DUY NHẤT để nhập vào ứng dụng Apron. Nếu nội dung chứa nhiều công thức khác nhau, hãy tách chúng vào mảng \"recipes\". NỘI DUNG ĐẦU VÀO: \"\"\" Canh sườn hầm rau củ: 500g sườn heo, 2 củ cà rốt, 1 củ khoai tây, 1 bắp ngô ngọt, hành lá, ngò rí. Ninh sườn 30 phút rồi cho củ vào hầm mềm, nêm muối tiêu vừa ăn. \"\"\" HÃY TRẢ VỀ DUY NHẤT MỘT KHỐI JSON HỢP LỆ VỚI CẤU TRÚC CHÍNH XÁC NHƯ SAU (KHÔNG KÈM BẤT KỲ VĂN BẢN GIẢI THÍCH NÀO NGOÀI JSON): { \"recipes\": [ { \"title\": \"Tên món ăn (Viết hoa chữ cái đầu)\", \"description\": \"Mô tả ngắn gọn, hấp dẫn về món ăn\", \"difficulty\": \"Dễ\", // Chỉ được chọn 1 trong 3: \"Dễ\", \"Vừa\", \"Khó\" \"prep_time_minutes\": 15, // Thời gian chuẩn bị/sơ chế (số phút, số nguyên) \"cook_time_minutes\": 30, // Thời gian nấu (số phút, số nguyên) \"servings\": 4, // Khẩu phần (số người, số nguyên) \"calories\": 450, // Lượng calo ước tính (kcal, số nguyên). Tự ước lượng nếu không có sẵn \"notes\": \"<p>Ghi chú thêm, mẹo vặt, lưu ý (dùng thẻ HTML cơ bản như &lt;p&gt;, &lt;strong&gt;, &lt;ul&gt;, &lt;li&gt;)</p>\", \"tags\": [ { \"name\": \"Bữa sáng\", \"is_new\": false }, { \"name\": \"Món canh\", \"is_new\": false } ], \"ingredientSections\": [ { \"name\": \"Nguyên liệu chính\", // Tên nhóm (ví dụ: \"Nguyên liệu chính\", \"Phần sốt\", \"Gia vị ướp\"...) \"ingredients\": [ { \"name\": \"Thịt bò\", \"amount\": \"300\", \"unit\": \"g\" }, { \"name\": \"Hành tây\", \"amount\": \"1\", \"unit\": \"củ\" } ] } ], \"stepSections\": [ { \"name\": \"Thực hiện\", // Tên giai đoạn (ví dụ: \"Sơ chế\", \"Chế biến\", \"Hoàn thiện\"...) \"steps\": [ { \"content\": \"<p>Sơ chế nguyên liệu sạch sẽ, cắt miếng vừa ăn.</p>\" }, { \"content\": \"<p>Đun sôi nước, nêm gia vị vừa miệng và hoàn thành món ăn.</p>\" } ] } ] } ] } QUY TẮC BẮT BUỘC: 1. Đối với Calories, Độ khó và Thời gian: nếu nguồn không có, BẠN BẮT BUỘC PHẢI TỰ DỰ ĐOÁN VÀ ĐIỀN SỐ THỰC TẾ dựa trên chuyên môn ẩm thực. 2. Tên nguyên liệu và các bước làm: BẮT BUỘC viết hoa chữ cái đầu tiên (Ví dụ: \"Thịt bò\", \"Hành lá\", \"Nước mắm\"). 3. Ưu tiên sử dụng tên nguyên liệu có sẵn trong từ điển sau: Thịt thăn bò, Cá lóc đồng. Hãy tự map từ đồng nghĩa về tên chuẩn. 4. Ưu tiên chọn thẻ tag có sẵn từ danh sách: Bữa sáng, Điểm tâm, Bánh mì, Bữa chính (Trưa/Tối), Cơm gia đình, Món tiệc, Ăn vặt, Cuối tuần, Món chính (Cơm), Món nước (Bún/Phở), Khai vị / Ăn nhẹ, Đồ uống, Tráng miệng, Nước chấm / Sốt, Việt Nam - Miền Bắc, Việt Nam - Miền Trung, Việt Nam - Miền Nam, Âu Mỹ, Hàn Quốc, Nhật Bản, Canh / Súp, Hầm / Ninh, Kho / Om, Hấp / Luộc, Chiên / Rán, Xào, Nướng, Làm bánh, Thịt các loại, Thịt heo, Thịt bò, Gà / Vịt, Hải sản, Cá, Tôm, Rau củ & Nấm, Nấm, Đậu phụ, Eat Clean / Healthy, Keto / Low-carb, Thuần chay, Giảm cân. (Nếu dùng tag có sẵn, đặt \"is_new\": false; nếu tag mới chưa có, đặt \"is_new\": true và gán \"category_id\" bằng 1 trong các giá trị: \"root-meal\", \"root-cooking\", \"root-ingredient\", \"root-cuisine\", \"root-diet\", \"root-time-difficulty\"). 5. Dò tìm trong danh sách mẹo: [85e31d39-d374-4dd6-868b-bc3c59727499] Bí quyết chọn xương bò nấu phở ngon, [cbdc3e30-1fe7-4718-ad33-e17a65ba87e8] Bí quyết chọn xương bò nấu phở ngon, [33806b1f-c1a0-445c-bd45-695b76360d6e] Cách giữ bơ sáp không bị thâm, [ca821206-563f-4fb8-8469-cf46cea487a9] Cách giữ bơ sáp không bị thâm, [e258cd13-4c35-471f-91db-ba9722a9632c] Mẹo ướp thịt nướng mềm mọng không bị khô, [3978555a-0748-45ce-ab37-e45f0fc14267] Mẹo ướp thịt nướng mềm mọng không bị khô. Nếu có mẹo liên quan, trả về mảng linked_tips chứa ID của mẹo đó. 6. TUYỆT ĐỐI CHỈ TRẢ VỀ MÃ JSON, KHÔNG CÓ BẤT KỲ LỜI CHÀO HAY VĂN BẢN NÀO BÊN NGOÀI KHỐI JSON."
