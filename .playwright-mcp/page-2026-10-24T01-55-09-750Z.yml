                  - generic [ref=f1e94]: "2"
                  - generic [ref=f1e97]:
                    - generic [ref=f1e98]: Cà rốt gọt vỏ, khứa rãnh tỉa hoa rồi cắt khúc dày khoảng 1.5cm. Sả cây bóc bớt bẹ già, cắt khúc 7cm và đập dập phần gốc để tinh dầu tiết ra thơm nhất. Hành khô, tỏi và gừng băm nhỏ.
                    - generic [ref=f1e100] [cursor=pointer]
                - generic [ref=f1e102]:
                  - generic [ref=f1e103]: "3"
                  - generic [ref=f1e105]:
                    - generic [ref=f1e106]: "Ướp thịt bò với: 1 gói bột gia vị bò kho, 2 muỗng dầu màu điều, 1 muỗng hạt nêm, 1 muỗng đường, 1/2 muỗng tiêu xay, 1 muỗng nước mắm và nửa phần hành tỏi gừng băm. Trộn bóp thật kỹ, để 30 - 45 phút cho ngấm sâu."
                    - generic [ref=f1e108] [cursor=pointer]
