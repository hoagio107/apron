              - 'heading "Giai đoạn 2: Nấu & Hầm nhừ" [level=3] [ref=f1e113]'
              - generic [ref=f1e114]:
                - generic [ref=f1e115]:
                  - generic [ref=f1e116]: "1"
                  - generic [ref=f1e119]:
                    - generic [ref=f1e120]: Đặt nồi gang hoặc nồi đáy dày lên bếp, cho 2 muỗng dầu màu điều vào đun nóng. Phi thơm phần hành tỏi gừng băm còn lại cùng sả đập dập cho dậy mùi thơm nức.
                    - generic [ref=f1e122] [cursor=pointer]
                - generic [ref=f1e124]:
                  - generic [ref=f1e125]: "2"
                  - generic [ref=f1e128]:
                    - generic [ref=f1e129]: Trút toàn bộ thịt bò đã ướp vào đảo nhanh trên lửa lớn trong 5-7 phút cho đến khi từng thớ thịt săn chắc lại, màu điều áo đều óng ả và tỏa hương thảo mộc ngào ngạt.
                    - generic [ref=f1e131] [cursor=pointer]
                - generic [ref=f1e133]:
                  - generic [ref=f1e134]: "3"
                  - generic [ref=f1e137]:
                    - generic [ref=f1e138]: Đổ 1 lít nước dừa tươi vào nồi ngập thịt. Đun sôi bùng lên rồi hạ lửa nhỏ, liên tục vớt sạch bọt nổi lên để nước dùng trong ngọt. Đậy hé nắp hầm liu riu trong 45-50 phút cho thịt mềm dẻo.
                    - generic [ref=f1e140] [cursor=pointer]
                - generic [ref=f1e142]:
                  - generic [ref=f1e143]: "4"
                  - generic [ref=f1e145]:
                    - generic [ref=f1e146]: Khi thịt đã mềm rục, cho cà rốt vào nấu thêm 15 phút. Hòa tan bột năng với 3 muỗng nước lạnh, từ từ rưới vào nồi khuấy đều tay cho nước sốt sánh mịn sền sệt, nêm nếm lại gia vị cho vừa miệng rồi tắt bếp.
