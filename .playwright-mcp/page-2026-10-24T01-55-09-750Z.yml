                  - generic [ref=f1e85]: "1"
                  - generic [ref=f1e88]:
                    - generic [ref=f1e89]: Nạm bò và gân bò rửa sạch với nước muối loãng, gừng đập dập và 1 muỗng rượu trắng để khử sạch mùi hoi. Thấm khô rồi cắt khối vuông quân cờ khoảng 3x3cm vừa miệng.
                    - generic [ref=f1e91] [cursor=pointer]
