      - generic [ref=f13e449]: "Bạn là một chuyên gia ẩm thực và chuyên gia mẹo vặt nhà bếp giàu kinh nghiệm. Nhiệm vụ: Hãy tạo hoặc hoàn thiện một mẹo vặt nhà bếp chuẩn xác, súc tích và hữu ích từ nội dung/yêu cầu dưới đây thành MỘT ĐỐI TƯỢNG JSON DUY NHẤT để nhập vào ứng dụng Apron. NỘI DUNG / CHỦ ĐỀ ĐẦU VÀO: \"\"\" Chia sẻ một mẹo vặt nhà bếp hữu ích, thiết thực và hiệu quả nhất \"\"\" DANH SÁCH CHUYÊN MỤC HỢP LỆ (chỉ được chọn 1 ID trong danh sách này cho category_id): \"cooking\" (Mẹo nấu ăn: Bí quyết giúp món ăn ngon hơn), \"cleaning\" (Mẹo vệ sinh: Giữ bếp luôn sạch bóng), \"preservation\" (Mẹo bảo quản: Giữ thực phẩm tươi lâu), \"shopping\" (Mẹo chọn mua: Chọn đồ tươi ngon nhất), \"prep\" (Mẹo sơ chế: Sơ chế nhanh và đúng cách), \"fixing\" (Mẹo \"chữa cháy\": Cứu vãn các món ăn bị lỗi), \"organization\" (Sắp xếp & Tổ chức: Tối ưu không gian bếp), \"tools\" (Chăm sóc dụng cụ: Bảo dưỡng nồi, chảo, dao), \"utilization\" (Mẹo tận dụng: Tái chế & tránh lãng phí) HÃY TRẢ VỀ DUY NHẤT MỘT KHỐI JSON HỢP LỆ VỚI CẤU TRÚC CHÍNH XÁC NHƯ SAU (KHÔNG KÈM BẤT KỲ VĂN BẢN GIẢI THÍCH NÀO NGOÀI JSON): { \"title\": \"Tiêu đề mẹo vặt ngắn gọn, súc tích, hấp dẫn (VD: Cách bảo quản bơ sáp tươi lâu không thâm đen)\", \"category_id\": \"preservation\", // Chọn chính xác 1 ID trong danh sách chuyên mục trên \"content\": \"<p><strong>Bí quyết thực hiện:</strong></p><p>Giải thích nguyên lý ngắn gọn...</p><ul><li><strong>Bước 1:</strong> Thao tác chi tiết...</li><li><strong>Bước 2:</strong> Lưu ý quan trọng...</li></ul><p><em>Lời khuyên thêm nếu có.</em></p>\" } QUY TẮC BẮT BUỘC: 1. \"category_id\" BẮT BUỘC phải là một trong các id: \"cooking\", \"cleaning\", \"preservation\", \"shopping\", \"prep\", \"fixing\", \"organization\", \"tools\", \"utilization\". 2. \"content\" được định dạng bằng HTML cơ bản (<p>, <strong>, <em>, <ul>, <li>) để hiển thị đẹp mắt trong trình soạn thảo Rich Text. 3. Nội dung mẹo phải thực tế, khoa học, dễ áp dụng và mang lại hiệu quả cao. 4. TUYỆT ĐỐI CHỈ TRẢ VỀ MÃ JSON, KHÔNG CÓ BẤT KỲ LỜI CHÀO HAY VĂN BẢN NÀO BÊN NGOÀI KHỐI JSON."
